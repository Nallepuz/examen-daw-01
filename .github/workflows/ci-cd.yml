name: CI/CD Frontend 

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build Docker image and push to repositories
    runs-on: ubuntu-latest

    steps:
    # Paso 1 - Descarga el código de tu repo para poder trabajar con él
    - name: Checkout code
      uses: actions/checkout@v3

    # Paso 2 - Hace login en Docker Hub con tus credenciales
    # Los secrets los configuramos en GitHub para no poner la contraseña en texto plano
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}  # Tu usuario de Docker Hub
        password: ${{ secrets.DOCKER_PASSWORD }}  # Tu contraseña de Docker Hub

    # Paso 3 - Construye la imagen Docker del frontend y la sube a Docker Hub
    # Esto es el CI (Integración Continua)
    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: ./frontend       # Carpeta donde está el Dockerfile del frontend
        push: true                # Sube la imagen a Docker Hub automáticamente
        tags: nallepuz/temperaturas-frontend:latest  # Nombre y tag de la imagen

    # Paso 4 - Se conecta por SSH a tu EC2 y actualiza el deployment en Kubernetes
    # Esto es el CD (Despliegue Continuo)
    - name: Deploy to EKS
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ secrets.SSH_HOST }}      # IP pública de tu EC2
        username: ${{ secrets.SSH_USER }}  # Usuario de la EC2 (ec2-user)
        key: ${{ secrets.SSH_KEY }}        # Clave privada para conectarse por SSH
        port: ${{ secrets.SSH_PORT }}      # Puerto SSH (22)
        script: |
          # Actualiza la imagen del frontend en el cluster de Kubernetes
          kubectl set image deployment/temperaturas-frontend temperaturas-frontend=nallepuz/temperaturas-frontend:latest